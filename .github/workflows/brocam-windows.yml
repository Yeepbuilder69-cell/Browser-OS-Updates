name: Build Bro Cam for Windows

on:
  push:
    paths:
      - "BroCam/**"
      - ".github/workflows/brocam-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out Bro Cam project
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Check out Media Foundation virtual-camera source
        uses: actions/checkout@v4
        with:
          repository: smourier/VCamNetSample
          ref: main
          path: third_party/VCamNetSample

      - name: Build native virtual-camera media source
        shell: pwsh
        run: |
          dotnet publish third_party/VCamNetSample/VCamNetSampleSourceAOT/VCamNetSampleSourceAOT.csproj -c Release -r win-x64 -p:Platform=x64 -p:PublishAot=true -o "${{ github.workspace }}\\build\\source"

      - name: Build Bro Cam virtual-camera controller
        shell: pwsh
        run: |
          dotnet publish third_party/VCamNetSample/VCamNetSampleAOT/VCamNetSampleAOT.csproj -c Release -r win-x64 -p:Platform=x64 -p:PublishAot=true -o "${{ github.workspace }}\\build\\app"
          Copy-Item "build\\source\\VCamNetSampleSourceAOT.dll" "build\\app\\VCamNetSampleSourceAOT.dll" -Force
          if (Test-Path "build\\app\\VCamNetSampleAOT.exe") {
            Rename-Item "build\\app\\VCamNetSampleAOT.exe" "BroCam.exe"
          } else {
            throw "The virtual-camera controller executable was not produced."
          }
          Copy-Item "third_party\\VCamNetSample\\LICENSE" "build\\app\\THIRD-PARTY-LICENSE.txt"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Bro Cam Setup.exe
        shell: pwsh
        run: |
          & "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe" "BroCam\\installer\\BroCam.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed." }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BroCam-Windows-Installer
          path: BroCam/installer/output/BroCam-Setup.exe
          if-no-files-found: error
          retention-days: 30
